<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="referrer" content="no-referrer">
<title>Connect Ellipse to Google</title>
<link rel="stylesheet" href="./pair.css">
<script type="module" src="./pair.js"></script>
</head>
<body>
<main>
<h1>Connect Ellipse to Google</h1>
<p>Continue only if you just opened this page from your installed Ellipse app. Paste the response into that same app.</p>
<button id="connect" disabled>Continue with Google</button>
<p id="status" role="status"></p>
<div id="result" hidden>
<label for="response">Encrypted sign-in response</label>
<textarea id="response" readonly rows="5"></textarea>
<button id="copy">Copy response</button>
</div>
</main>
</body>
</html>
