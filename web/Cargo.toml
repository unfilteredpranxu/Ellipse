[package]
name = "ellipse-web"
version = "0.1.0"
edition = "2024"
publish = false

[workspace]

[dependencies]
leptos = { version = "0.8.23", features = ["csr"] }
wasm-bindgen = "0.2"
web-sys = { version = "0.3", features = ["Window", "CustomEvent", "Event", "EventTarget", "Storage", "File", "FileList", "HtmlInputElement", "HtmlDialogElement"] }
js-sys = "0.3"
console_error_panic_hook = "0.1"
ellipse-core = { path = "../crates/ellipse-core" }
serde_json = "1"
serde = "1"
send_wrapper = "0.6"
wasm-bindgen-futures = "0.4"
base64 = "0.22"
