[package]
name = "ellipse-native"
version = "0.1.0"
description = "Ellipse proprietary native shell for Windows and Android"
authors = ["Ellipse"]
edition = "2021"
license = "LicenseRef-Ellipse-Proprietary"

[lib]
name = "ellipse_native_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
sha2 = "0.10"
aes-gcm = "0.10"
hkdf = "0.12"
p256 = { version = "0.13", features = ["ecdh"] }
tauri-plugin-opener = "2"
base64 = "0.22"
ellipse-core = { path = "../../crates/ellipse-core" }
ellipse-notes-store = { path = "../../crates/ellipse-notes-store" }

# Keep the native Tauri package independent from the shared Rust-core workspace.
[workspace]
