<!doctype html>
<html lang="en"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#030303"><meta name="description" content="Ellipse — your private personal workspace.">
<title>Ellipse — Sign in with Google</title><link rel="icon" href="/favicon.svg" type="image/svg+xml"><link rel="manifest" href="/manifest.webmanifest"><link rel="stylesheet" href="/landing.css">
</head><body>
<main class="screen" aria-label="Ellipse welcome">
  <div class="hero-wrap"><img class="hero-art" src="/assets/ellipse-knight-clean.jpg" alt="Black and white stippled fantasy knight with sword" fetchpriority="high"></div>
  <section class="welcome-pane">
    <header class="topbar"><div class="brand"><span class="brand-mark" aria-hidden="true"></span><span>Ellipse</span></div></header>
    <div class="welcome-copy"><h1>Welcome back</h1><p>Sign in to pick up where you left off.</p></div>
    <div class="bottom">
      <div class="signed-in" id="account" hidden><div><div class="account-name" id="account-name"></div><div class="account-label">Connected with Google</div></div><button class="signout" type="button" id="logout">Sign out</button></div>
      <button class="signin-button" id="google" type="button"><svg class="google-mark" width="21" height="21" viewBox="0 0 48 48" aria-hidden="true">
      <path fill="#EA4335" d="M24 9.5c3.54 0 6.71 1.22 9.21 3.6l6.85-6.85C35.9 2.38 30.47 0 24 0 14.62 0 6.51 5.38 2.56 13.22l7.98 6.19C12.43 13.72 17.74 9.5 24 9.5z"/>
      <path fill="#4285F4" d="M46.98 24.55c0-1.57-.15-3.09-.38-4.55H24v9.02h12.94c-.58 2.96-2.26 5.48-4.78 7.18l7.73 6C44.4 38.04 46.98 31.9 46.98 24.55z"/>
      <path fill="#FBBC05" d="M10.53 28.59c-.48-1.44-.75-2.97-.75-4.59l-7.98-6.2C.92 16.46 0 20.12 0 24s.92 7.54 2.56 10.78l7.97-6.19z"/>
      <path fill="#34A853" d="M24 48c6.48 0 11.93-2.13 15.91-5.8l-7.73-6c-2.15 1.45-4.92 2.3-8.18 2.3-6.26 0-11.57-4.22-13.47-9.91l-7.98 6.19C6.51 42.62 14.62 48 24 48z"/></svg><span>Continue with Google</span></button>
      <p class="notice" id="notice" role="status" aria-live="polite"></p>
    </div>
  </section>
</main>
<script type="module" src="/auth.js"></script>
<script>
const $=id=>document.getElementById(id);
$("google").onclick=()=>window.ellipseLogin?.();
$("logout").onclick=()=>window.ellipseLogout?.();
function state(s){
  const connected=s.type==="signed_in";
  $("account").hidden=!connected;
  $("google").hidden=connected;
  if(connected)$("account-name").textContent=s.name||s.email||"Google account";
  $("notice").textContent=s.type==="error"?s.message:s.type==="busy"?"Opening Google…":"";
}
window.addEventListener("ellipse:auth",e=>state(e.detail));
if(window.ellipseAuthSnapshot)state(window.ellipseAuthSnapshot);
if("serviceWorker" in navigator && location.protocol==="https:")navigator.serviceWorker.register("/sw.js").catch(()=>{});
</script></body></html>
