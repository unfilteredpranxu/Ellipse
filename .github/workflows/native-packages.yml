name: Ellipse — native packages
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/native-packages.yml'
      - 'native/package.json'
      - 'native/src-tauri/**'
      - 'crates/ellipse-notes-store/**'
      - 'crates/ellipse-core/src/notes/**'
      - 'web/src/notes/**'
  workflow_dispatch:
    inputs:
      platform:
        description: "Which native platform?"
        required: true
        type: choice
        options: [windows, macos, android, ios-compile-check]
permissions:
  contents: read
jobs:
  windows:
    if: github.event_name == 'push' || inputs.platform == 'windows'
    runs-on: windows-latest
    timeout-minutes: 70
    defaults:
      run:
        working-directory: native
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - uses: dtolnay/rust-toolchain@stable
        with: {targets: wasm32-unknown-unknown}
      - uses: taiki-e/install-action@v2
        with: {tool: trunk}
      - run: npm install
      - run: npm run icons
      - run: npm run tauri -- build
      - uses: actions/upload-artifact@v4
        with:
          name: ellipse-windows
          path: native/src-tauri/target/release/bundle/**
          if-no-files-found: error
  macos:
    if: github.event_name == 'push' || inputs.platform == 'macos'
    runs-on: macos-15
    timeout-minutes: 70
    defaults:
      run:
        working-directory: native
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - uses: dtolnay/rust-toolchain@stable
        with: {targets: wasm32-unknown-unknown}
      - uses: taiki-e/install-action@v2
        with: {tool: trunk}
      - name: Record the macOS and Xcode versions
        run: |
          sw_vers
          xcodebuild -version
      - run: npm install
      - run: npm run icons
      - run: npm run tauri -- build
        env: {APPLE_SIGNING_IDENTITY: "-"}
      - uses: actions/upload-artifact@v4
        with:
          name: ellipse-macos
          path: native/src-tauri/target/release/bundle/**
          if-no-files-found: error
  android:
    if: github.event_name == 'push' || inputs.platform == 'android'
    runs-on: ubuntu-latest
    timeout-minutes: 75
    defaults:
      run:
        working-directory: native
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - uses: actions/setup-java@v4
        with: {distribution: temurin, java-version: '17'}
      - uses: android-actions/setup-android@v4
        with:
          cmdline-tools-version: "16111833"
          packages: "platform-tools"
      - name: Install Android SDK and NDK
        run: |
          sdkmanager --install "platforms;android-36" "platforms;android-37.0" "build-tools;36.0.0" "ndk;27.2.12479018"
          echo "NDK_HOME=$ANDROID_HOME/ndk/27.2.12479018" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/27.2.12479018" >> "$GITHUB_ENV"
      - uses: dtolnay/rust-toolchain@stable
        with: {targets: "wasm32-unknown-unknown,aarch64-linux-android"}
      - uses: taiki-e/install-action@v2
        with: {tool: trunk}
      - run: npm install
      - run: npm run icons
      - run: npm run tauri -- android init --ci
      - run: npm run tauri -- android build --ci --apk --target aarch64
      - uses: actions/upload-artifact@v4
        with:
          name: ellipse-android-unsigned
          path: native/src-tauri/gen/android/app/build/outputs/apk/**/*.apk
          if-no-files-found: warn
  ios-compile-check:
    if: github.event_name == 'push' || inputs.platform == 'ios-compile-check'
    runs-on: macos-15
    timeout-minutes: 70
    defaults:
      run:
        working-directory: native
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - uses: dtolnay/rust-toolchain@stable
        with: {targets: "wasm32-unknown-unknown,aarch64-apple-ios,aarch64-apple-ios-sim,x86_64-apple-ios"}
      - uses: taiki-e/install-action@v2
        with: {tool: trunk}
      - name: Check Xcode and the iPhoneOS SDK
        run: |
          sw_vers
          xcodebuild -version
          xcrun --sdk iphoneos --show-sdk-version
      - run: npm install
      - run: npm run icons
      - run: npm run tauri -- ios init --ci
      - name: Check generated Xcode project
        run: |
          project=$(find src-tauri/gen/apple -name '*.xcodeproj' -type d -print -quit)
          test -n "$project"
          xcodebuild -list -project "$project"
      - run: npm run build
      - run: cargo check --manifest-path src-tauri/Cargo.toml --target aarch64-apple-ios
      - name: Build an unsigned simulator app
        run: |
          target=x86_64
          output=x86_64
          if [ "$(uname -m)" = arm64 ]; then
            target=aarch64-sim
            output=arm64-sim
          fi
          npm run tauri -- ios build --ci --no-sign --target "$target"
          app=$(find "src-tauri/gen/apple/build/$output" -name '*.app' -type d -print -quit)
          test -n "$app"
          /usr/libexec/PlistBuddy -c 'Print :UIFileSharingEnabled' "$app/Info.plist" | grep -qx true
          ditto -c -k --sequesterRsrc --keepParent "$app" "$RUNNER_TEMP/ellipse-ios-simulator.zip"
          printf 'ELLIPSE_SIM_APP=%s/%s\n' "$PWD" "$app" >> "$GITHUB_ENV"
      - name: Build an unsigned iPhone and iPad IPA
        run: |
          npm run tauri -- ios build --ci --no-sign --target aarch64
          ipa=$(find src-tauri/gen/apple/build/arm64 -name '*.ipa' -type f -print -quit)
          test -n "$ipa"
          verification=$(mktemp -d)
          unzip -q "$ipa" -d "$verification"
          app=$(find "$verification/Payload" -maxdepth 1 -name '*.app' -type d -print -quit)
          test -n "$app"
          plist="$app/Info.plist"
          test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "$plist")" = app.ellipse.workspace
          /usr/libexec/PlistBuddy -c 'Print :MinimumOSVersion' "$plist"
          executable=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleExecutable' "$plist")
          file "$app/$executable" | grep -q arm64
          test ! -f "$app/embedded.mobileprovision"
          {
            printf 'Source commit: %s\n' "$GITHUB_SHA"
            printf 'Bundle ID: app.ellipse.workspace\n'
            printf 'Minimum OS: '
            /usr/libexec/PlistBuddy -c 'Print :MinimumOSVersion' "$plist"
            printf 'Embedded device provisioning: absent\n'
            codesign --display --verbose=2 "$app" 2>&1 || true
          } > "$RUNNER_TEMP/ellipse-ios-payload.txt"
          cp "$ipa" "$RUNNER_TEMP/ellipse-ios-device-unsigned.ipa"
      - name: Launch the packaged app on an available Simulator
        if: ${{ !cancelled() && env.ELLIPSE_SIM_APP != '' }}
        run: |
          device=$(xcrun simctl list devices available --json | python3 -c 'import json,sys; devices=[d for group in json.load(sys.stdin)["devices"].values() for d in group if d["name"].startswith(("iPad","iPhone"))]; print(next((d["udid"] for d in devices if d["name"].startswith("iPad")), devices[0]["udid"] if devices else ""))')
          if [ -z "$device" ]; then
            echo "::warning::No iOS Simulator device was available for the launch check."
            exit 0
          fi
          xcrun simctl bootstatus "$device" -b
          xcrun simctl install "$device" "$ELLIPSE_SIM_APP"
          status=0
          xcrun simctl launch "$device" app.ellipse.workspace || status=$?
          xcrun simctl spawn "$device" log show --last 3m --style compact \
            --predicate 'process == "Ellipse"' > "$RUNNER_TEMP/ellipse-ios-simulator.log" || true
          exit "$status"
      - name: Record SHA-256 artifact digests
        if: always()
        run: |
          cd "$RUNNER_TEMP"
          artifacts=()
          for artifact in ellipse-ios-simulator.zip ellipse-ios-device-unsigned.ipa; do
            if [ -f "$artifact" ]; then artifacts+=("$artifact"); fi
          done
          if [ "${#artifacts[@]}" -gt 0 ]; then
            shasum -a 256 "${artifacts[@]}" > ellipse-ios-sha256.txt
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ellipse-ios-builds-unsigned
          path: |
            ${{ runner.temp }}/ellipse-ios-simulator.zip
            ${{ runner.temp }}/ellipse-ios-device-unsigned.ipa
            ${{ runner.temp }}/ellipse-ios-sha256.txt
            ${{ runner.temp }}/ellipse-ios-payload.txt
            ${{ runner.temp }}/ellipse-ios-simulator.log
          if-no-files-found: warn
      - uses: actions/upload-artifact@v4
        with:
          name: ellipse-ios-xcode-project
          path: native/src-tauri/gen/apple/**
          if-no-files-found: warn
