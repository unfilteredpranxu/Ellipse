name: Ellipse — verify Rust and preview
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate hosted M01 screen
        run: python3 scripts/verify_site.py
      - uses: dtolnay/rust-toolchain@stable
      - name: Test shared Rust core
        run: cargo test --workspace --all-targets
