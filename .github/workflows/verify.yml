name: Ellipse — Rust, WASM and deployment acceptance
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  core:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - run: cargo fmt --all --check
      - run: cargo test --workspace --all-targets
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: python3 scripts/verify_site.py
  web-wasm:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: web
      - uses: taiki-e/install-action@v2
        with:
          tool: trunk
      - run: cargo fmt --manifest-path web/Cargo.toml --check
      - run: cargo clippy --manifest-path web/Cargo.toml --target wasm32-unknown-unknown -- -D warnings
      - name: Compile actual Leptos Rust UI to WebAssembly
        run: bash scripts/build-pages.sh
      - name: Assert production output includes WebAssembly
        run: |
          test -s dist/index.html
          find dist -name '*.wasm' -size +1c | grep -q wasm
          test -s dist/assets/ellipse-knight-clean.jpg
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: tests/browser/package-lock.json
      - run: npm ci
        working-directory: tests/browser
      - run: npx playwright install --with-deps chromium
        working-directory: tests/browser
      - run: npm test
        working-directory: tests/browser
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ellipse-browser-evidence
          path: tests/browser/test-results/
          if-no-files-found: ignore
