name: Ellipse — Rust, WASM and deployment acceptance
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  core:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo test --workspace --all-targets
      - run: python3 scripts/verify_site.py
  web-wasm:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: web
      - uses: taiki-e/install-action@v2
        with:
          tool: trunk
      - name: Compile actual Leptos Rust UI to WebAssembly
        run: bash scripts/build-pages.sh
      - name: Assert production output includes WebAssembly
        run: |
          test -s dist/index.html
          find dist -name '*.wasm' -size +1c | grep -q wasm
          test -s dist/assets/ellipse-art.jpg
