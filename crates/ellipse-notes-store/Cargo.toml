[package]
name = "ellipse-notes-store"
version = "0.1.0"
edition = "2024"
license.workspace = true

[dependencies]
ellipse-core = { path = "../ellipse-core" }
rusqlite = { version = "0.37", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"

[dev-dependencies]
tempfile = "3"
